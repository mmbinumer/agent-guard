[project]
name = "agent-guard"
version = "0.1.0"
description = "Runtime security proxy for MCP agent tool calls"
requires-python = ">=3.11"
dependencies = [
    # 2.x only: proxy.py wires the lowlevel Server via the on_list_tools /
    # on_call_tool constructor callbacks, which do not exist in 1.x (and whose
    # 1.x decorator equivalents do not exist in 2.x). The two APIs have no
    # overlap worth bridging, so there is no 1.x fallback.
    "mcp>=2.0.0,<3.0.0",
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "click>=8.0",
]

[project.scripts]
agent-guard = "agent_guard.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.24"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agent_guard"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
