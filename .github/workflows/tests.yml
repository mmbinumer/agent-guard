name: tests

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    # The audit log uses fcntl on POSIX and msvcrt on Windows, so both need
    # real coverage - a green run on one OS says nothing about the other.
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: pip install -e ".[dev]"

      - name: Run tests
        run: pytest -q
